plugins {
    id 'com.android.application'
}

android {
    namespace 'com.focusforge.study'
    compileSdk 35

    defaultConfig {
        applicationId 'com.focusforge.study'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-beta'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            // No firmar ni distribuir como lanzamiento sin crear una clave de firma privada.
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
