name: Preparar FocusForge y compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir y guardar el proyecto
        run: |
          archive="$(find . -maxdepth 1 -type f -name 'FocusForge_OPPO_*.zip' -print -quit)"
          if [ -n "$archive" ]; then
            unzip -o "$archive" -d .
            git rm -- "$archive"
            git add -A         
            git reset -- .github/workflows/compilar-apk.yml
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Descomprimir proyecto Android"
            git push
          fi
          test -f app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probar la lógica
        run: node --test test_core.js test_web_bridge.js

      

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: FocusForge-OPPO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
